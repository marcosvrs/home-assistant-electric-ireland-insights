name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install "ruff==0.15.20"
      - name: Ruff check
        run: python -m ruff check custom_components/ tests/
      - name: Ruff format check
        run: python -m ruff format --check custom_components/ tests/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install typing dependencies
        run: pip install "homeassistant==2026.10.1" "mypy>=1.19" "beautifulsoup4>=4.13.3,<5.0.0"
      - name: Run mypy strict
        run: |
          mypy custom_components/electric_ireland_insights/ \
            --strict \
            --no-warn-return-any \
            --no-warn-unused-ignores \
            --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/electric_ireland_insights \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=99 \
            -q
